<!doctype html><html lang="zh-CN"><script>document.documentElement.dataset.theme=localStorage.getItem("zxw-theme")||"light"</script><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZXW · 设备管理</title><link rel="stylesheet" href="/style.css"></head><body><div class="shell"><aside id="sidebar"><button id="sidebar-toggle" class="sidebar-toggle" aria-label="收起侧栏" aria-expanded="true" aria-controls="sidebar-content">‹</button><div id="sidebar-content" class="sidebar-content"><div class="brand"><span class="brand-icon">◉</span><b>ZXW</b><span>设备管理</span></div><div class="nav-label">设备</div><div id="devices" class="devices"></div><div class="side-bottom"><button id="refresh-devices" class="side-button"><span class="side-icon">↻</span><span>刷新设备</span></button><button id="settings-button" class="side-button"><span class="side-icon">⚙</span><span>转发设置</span></button><button id="theme-button" class="side-button"><span class="side-icon">◐</span><span>切换明暗模式</span></button></div></div></aside><main><header><div><span class="eyebrow">设备管理</span><h1 id="device-name">随身 Wi-Fi</h1></div><span id="status-pill" class="pill">正在连接</span></header><div id="notice" hidden></div><div id="workspace"><section class="overview"><div class="stat"><span>网络</span><strong id="signal">—</strong></div><div class="stat hotspot"><div><span>无线热点</span><strong id="wifi-label">—</strong></div><button id="wifi" class="switch" aria-label="切换无线热点"><i></i></button></div><div class="stat hotspot"><div><span>数据连接</span><strong id="data-label">—</strong></div><button id="data-toggle" class="switch" aria-label="切换数据连接" disabled><i></i></button></div><div id="led-stat" class="stat hotspot" hidden><div><span>指示灯</span><strong id="led-label">—</strong></div><button id="led-toggle" class="switch" aria-label="切换指示灯" disabled><i></i></button></div></section><nav class="tabs"><button class="tab active" data-tab="sms">短信</button><button class="tab" data-tab="esim">eSIM</button></nav><section id="sms" class="page"><div class="page-toolbar"><button class="button" id="refresh-sms">↻ 刷新</button></div><div class="sms-layout"><div class="card conversation-list"><div class="conversation-heading"><h2>短信</h2><span id="message-count" class="count">0</span></div><button class="primary new-conversation" id="compose-button">＋　新建会话</button><input id="message-search" class="search" type="search" placeholder="搜索号码或短信"><div class="filter-tabs"><button class="active" data-filter="all">全部</button><button data-filter="unread">未读 <span id="unread-count"></span></button></div><div id="conversations"><div class="empty">正在读取短信…</div></div></div><div class="card conversation-detail"><div id="conversation-content"><div class="empty">选择一个会话查看短信</div></div><form id="message-form" class="message-compose" hidden><textarea id="sms-content" rows="1" placeholder="输入短信内容"></textarea><button class="primary" id="send-sms" type="submit">发送</button></form></div></div></section><section id="esim" class="page" hidden><div class="section-head"><h2>eSIM</h2><div><button class="button" id="install-button">＋ 下载 eSIM</button> <button class="button" id="refresh-esim">↻ 刷新</button></div></div><div id="install" class="card settings-card" hidden><label>激活码<input id="activation" placeholder="LPA:1$..." autocomplete="off"></label><label>确认码（如运营商要求）<input id="confirmation" autocomplete="off"></label><button class="primary" id="download-esim">开始下载</button> <button class="button" id="cancel-install">取消</button></div><div class="esim-layout"><div id="profiles" class="profile-list"><div class="empty">正在读取 eSIM…</div></div><div id="esim-info" class="card esim-info"><div class="empty">正在读取信息…</div></div></div></section></div><section id="settings" class="page" hidden><div class="section-head"><div><h2>Telegram 转发</h2><p>将设备收到的新短信发送到指定会话</p></div></div><div class="card settings-card"><label>Bot Token<input id="tg-token" type="password" autocomplete="off" placeholder="已保存时留空可保持不变"></label><label>Chat ID<input id="tg-chat" autocomplete="off" placeholder="例如 123456789"></label><p class="hint">首次启用时记录已有短信，之后收到的新短信将自动转发。发送失败会重试。</p><button id="save-settings" class="primary">保存设置</button><button id="clear-token" class="button">停用转发</button></div></section></main></div><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
